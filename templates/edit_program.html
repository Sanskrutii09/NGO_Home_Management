<!DOCTYPE html>
<html>
<head>
    <title>Edit Program</title>
</head>
<body>

<h2>Edit Program</h2>

<form method="POST">

    <input
        type="text"
        name="name"
        value="{{ program['name'] }}"
        required>

    <br><br>

    <textarea
        name="description"
        required>{{ program['description'] }}</textarea>

    <br><br>

    <button type="submit">
        Update
    </button>

</form>

</body>
</html>
