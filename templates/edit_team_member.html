<!DOCTYPE html>
<html>
<head>
    <title>Edit Team Member</title>
</head>
<body>

<h2>Edit Team Member</h2>

<form method="POST">

    <input
        type="text"
        name="name"
        value="{{ member['name'] }}"
        required>

    <br><br>

    <input
        type="text"
        name="designation"
        value="{{ member['designation'] }}"
        required>

    <br><br>

    <button type="submit">
        Update
    </button>

</form>

</body>
</html>
