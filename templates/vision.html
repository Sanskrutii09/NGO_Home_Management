<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vision & Mission Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h2 class="mb-4">Vision & Mission Management</h2>

    <form method="POST">

        <!-- Vision Title -->
        <div class="mb-3">
            <label class="form-label">Vision Title</label>
            <input
                type="text"
                class="form-control"
                name="vision_title"
                value="{{ data['vision_title'] if data else '' }}"
                required>
        </div>

        <!-- Vision Description -->
        <div class="mb-3">
            <label class="form-label">Vision Description</label>
            <textarea
                class="form-control"
                rows="4"
                name="vision_description"
                required>{{ data['vision_description'] if data else '' }}</textarea>
        </div>

        <!-- Mission Title -->
        <div class="mb-3">
            <label class="form-label">Mission Title</label>
            <input
                type="text"
                class="form-control"
                name="mission_title"
                value="{{ data['mission_title'] if data else '' }}"
                required>
        </div>

        <!-- Mission Description -->
        <div class="mb-4">
            <label class="form-label">Mission Description</label>
            <textarea
                class="form-control"
                rows="4"
                name="mission_description"
                required>{{ data['mission_description'] if data else '' }}</textarea>
        </div>

        <button type="submit" class="btn btn-success">
            Save
        </button>

        <a href="/dashboard" class="btn btn-secondary">
            Back to Dashboard
        </a>

    </form>

</div>

</body>
</html>
